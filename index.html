<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="WebXR reference scene for bookchaowalit-vr: grab a cube, teleport, snap turn." />
    <title>VR Starter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#controls">Skip to VR controls</a>
    <header class="bar">
      <h1>VR Starter</h1>
      <p class="lede">A reference WebXR scene. In a headset: trigger on the cube to grab it, trigger on the floor to teleport, thumbstick left or right to snap turn.</p>
    </header>
    <main id="stage" class="stage"></main>
    <footer id="controls" class="bar controls">
      <button id="enter-vr" type="button" disabled>Checking for VR…</button>
      <p id="xr-status" class="status" role="status" aria-live="polite">Loading the scene…</p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
