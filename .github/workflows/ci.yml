name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  starter-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify starter contract
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s .github/workflows/ci.yml

  # Shared security scan (gitleaks, Semgrep, OSV-Scanner, Trivy) from platform-ci-workflows.
  # The language CIs (ci-node.yml / ci-python.yml) do not fit yet: this starter has no stack,
  # so the starter contract above stays the build check until a product scaffold lands.
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
